name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "media/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "media/**"
      - "LICENSE"

defaults:
  run:
    shell: bash

jobs:
  check:
    name: format / lint / test
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: integration test
    # Full image: it ships the GUI libraries (libatk, libgtk, ...) that VS Code's
    # Electron needs. ubuntu-slim lacks them, so the editor fails to launch.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run compile
      # The integration test launches a real VSCode, which needs a virtual display on
      # Linux. xvfb-run is preinstalled on GitHub-hosted ubuntu runners.
      - run: xvfb-run -a npm run test:integration
